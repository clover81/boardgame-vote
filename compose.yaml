services:
    mysql:
        image: mysql:8.4
        container_name: boardgame-vote-mysql
        restart: unless-stopped

        ports:
            - "3307:3306"

        environment:
            MYSQL_DATABASE: boardgame_vote
            MYSQL_USER: boardgame
            MYSQL_PASSWORD: boardgame
            MYSQL_ROOT_PASSWORD: root

        volumes:
            - boardgame_vote_mysql:/var/lib/mysql

volumes:
    boardgame_vote_mysql:
